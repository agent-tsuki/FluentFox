name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluentfox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fluentfox_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The schema comes from GORM AutoMigrate (cmd/migrate), not SQL files.
      # cmd/migrate loads the full app config, so every required key needs a
      # value; all of these are CI-only placeholders, not real secrets.
      - name: Run migrations
        env:
          APP_ENV: production
          PORT: "8080"
          APP_URL: http://localhost:3000
          ALLOWED_ORIGINS: http://localhost:3000
          DB_MAX_CONNS: "5"
          DB_MIN_CONNS: "1"
          JWT_ACCESS_SECRET: ci-placeholder-not-a-real-secret-0123456789
          JWT_ACCESS_EXPIRY_MINUTES: "15"
          JWT_REFRESH_EXPIRY_DAYS: "7"
          SMTP_HOST: localhost
          SMTP_PORT: "587"
          SMTP_USERNAME: ci@example.com
          SMTP_APP_PASSWORD: ci-placeholder
          EMAIL_FROM_ADDRESS: ci@example.com
          R2_ACCOUNT_ID: ci-placeholder
          R2_ACCESS_KEY: ci-placeholder
          R2_SECRET_KEY: ci-placeholder
          R2_BUCKET_NAME: ci-placeholder
          R2_PUBLIC_URL: http://localhost
        run: go run ./cmd/migrate

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
